name: Exevra integration

on:
  workflow_dispatch:

jobs:
  exevra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize Exevra baseline
        run: npx --yes @exevra-dev/cli@0.4.1 init --maven

      - name: Check Exevra baseline
        run: npx --yes @exevra-dev/cli@0.4.1 check --config .exevra.yml --format github-actions
